<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflex</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- header (shared) -->
    <div class="brandrow">
      <div class="mark" id="brandMark">R</div>
      <div class="brandtext">
        <div class="bname">Reflex</div>
        <div class="btag">Upwork copilot</div>
      </div>
    </div>

    <!-- signed-out -->
    <div id="signedOut" class="screen">
      <div class="lead">Sign in to your Reflex account.</div>

      <label class="flabel" for="email">Work email</label>
      <input class="field" id="email" type="email" placeholder="you@growwstacks.com" autocomplete="username">

      <label class="flabel" for="pw">Password</label>
      <div class="pwwrap">
        <input class="field" id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pwtoggle" id="pwToggle" aria-label="Show password" title="Show password">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="err hidden" id="error"></div>
      <button class="btn primary full" id="signin">Sign in</button>
      <div class="hint">No OTP — your admin controls access.</div>
    </div>

    <!-- signed-in / active -->
    <div id="signedIn" class="screen hidden">
      <div class="usercard">
        <div class="avatar" id="userAvatar">R</div>
        <div class="userinfo">
          <div class="uname" id="userName">Signed in</div>
          <div class="status"><span class="dot"></span> Active</div>
        </div>
      </div>

      <div class="callout ok-bg">
        <span class="callout-ic">✦</span>
        <span>Open any Upwork page and click the <b>Reflex</b> button in the bottom-right corner to start.</span>
      </div>

      <button class="btn ghost full" id="signout">Sign out</button>
    </div>

    <!-- deactivated -->
    <div id="deactivated" class="screen hidden">
      <div class="callout warn-bg">
        <span class="callout-ic">!</span>
        <span>Your access has been turned off. Contact your admin.</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
